name: ZeroEchelon
options:
  bundleIdPrefix: kaiserdem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  DEVELOPMENT_TEAM: Q2TWT4N9WP
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ZeroEchelon:
    type: application
    platform: iOS
    sources:
      - path: ZeroEchelon
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kaiserdem.ZeroEchelon
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_PREVIEWS: YES
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_EMIT_LOC_STRINGS: YES
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: Zero Echelon
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
  ZeroEchelonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZeroEchelonTests
    dependencies:
      - target: ZeroEchelon
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kaiserdem.ZeroEchelonTests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZeroEchelon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZeroEchelon"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ZeroEchelon:
    build:
      targets:
        ZeroEchelon: all
        ZeroEchelonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZeroEchelonTests
