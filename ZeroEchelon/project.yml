name: ZeroEchelon
options:
  bundleIdPrefix: com.line24
  deploymentTarget:
    iOS: "15.8"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  DEVELOPMENT_TEAM: QC9K654M6G
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "15.8"
targets:
  ZeroEchelon:
    type: application
    platform: iOS
    sources:
      - path: ZeroEchelon
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.line24.app
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_PREVIEWS: YES
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_EMIT_LOC_STRINGS: YES
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
      INFOPLIST_KEY_CFBundleDisplayName: Line 24
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Line 24 uses speech recognition only to help you dictate an address when entering a location."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Line 24 uses the microphone only for optional address dictation."
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Line 24 uses your location to fill coordinates for the emergency services draft when you choose GPS."
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
  ZeroEchelonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZeroEchelonTests
    dependencies:
      - target: ZeroEchelon
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.line24.appTests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZeroEchelon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZeroEchelon"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ZeroEchelon:
    build:
      targets:
        ZeroEchelon: all
        ZeroEchelonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZeroEchelonTests
